name: Publish design preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Check preview expiry
        id: policy
        run: python3 scripts/preview_deploy_check.py
  build:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check preview.js
          python3 -m unittest discover -s scripts -p '*_test.py'
          node --check motion.js
          node --check navigation.js
          node --check product.js
          node --check collection.js
          node --check site.js
          node --check commerce.js
          node --check checkout.js
          node --test scripts/commerce.test.cjs
      - name: Validate and build static site
        run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
